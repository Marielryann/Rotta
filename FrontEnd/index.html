<!doctype html>

    <link rel="stylesheet" href="styles.css">
    <script src="js/ui.js" defer></script>
    <script src="pages/welcome.js" defer></script>

    <script src="pages/comparison.js" defer></script>

      <a class="topbar-link" href="#welcome" data-nav="welcome">Sobre o Rotta</a>

    <div class="app-layout" id="app-layout">
